name: checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcp_google_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d mcp_google_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/mcp_google_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements.lock hatchling
      - run: python -m pip install --no-build-isolation -c requirements.lock '.[dev]'
      - run: ruff check app tests scripts migrations --no-cache
      - run: python -m pip check
      - run: pytest -q
      - run: docker build --no-cache -t mcp-google:check .
